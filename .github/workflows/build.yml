name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (framework-dependent)
        run: >
          dotnet publish OSCAutoClicker.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish/framework-dependent

      - name: Upload artifact for test build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: OSCAutoClicker-win-x64
          path: publish/framework-dependent/

      - name: Zip for release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: Compress-Archive -Path publish/framework-dependent/* -DestinationPath "OSCAutoClicker-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: OSCAutoClicker-*-win-x64.zip
          generate_release_notes: true